<div class="admin-sidebar">
    <div class="admin-header">
        <h2>Admin Portal</h2>
        <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <i class="fas fa-bars"></i>
        </button>
    </div>
    <nav class="admin-nav" id="adminNav">
        <div class="user-profile">
            <div class="user-avatar">
                <div class="avatar-placeholder">A</div>
            </div>
            <div class="user-info">
                <span class="user-name">Administrator</span>
                <span class="user-role">Super Admin</span>
            </div>
        </div>

        <a href="{{ url_for('admin_dashboard') }}"
            class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
            <i class="fas fa-tachometer-alt"></i>
            <span>Dashboard</span>
        </a>
        <a href="{{ url_for('admin_voters') }}" class="nav-item {% if active_page == 'voters' %}active{% endif %}">
            <i class="fas fa-users"></i>
            <span>Voters</span>
        </a>
        <a href="{{ url_for('admin_candidates') }}"
            class="nav-item {% if active_page == 'candidates' %}active{% endif %}">
            <i class="fas fa-user-tie"></i>
            <span>Candidates</span>
        </a>
        <a href="{{ url_for('admin_statistics') }}"
            class="nav-item {% if active_page == 'statistics' %}active{% endif %}">
            <i class="fas fa-chart-bar"></i>
            <span>Statistics</span>
        </a>
        <a href="{{ url_for('admin_logs') }}" class="nav-item {% if active_page == 'logs' %}active{% endif %}">
            <i class="fas fa-file-alt"></i>
            <span>Logs</span>
        </a>

        <div class="sidebar-spacer"></div>

        <div class="theme-toggle-container">
            <span class="theme-label">Dark Mode</span>
            <label class="switch">
                <input type="checkbox" id="themeToggle">
                <span class="slider round"></span>
            </label>
        </div>

        <a href="{{ url_for('admin_logout') }}" class="nav-item logout">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </a>
    </nav>
</div>
